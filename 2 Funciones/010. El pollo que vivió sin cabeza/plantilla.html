<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Lilita"; src: url("fuentes/LilitaOne-Regular.ttf"); }
      @font-face { font-family: "Rye"; src: url("fuentes/Rye-Regular.ttf"); }
      @font-face { font-family: "Bagel"; src: url("fuentes/BagelFatOne-Regular.ttf"); }
      html, body { margin: 0; background: #8cc6e8; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #8cc6e8; }
      canvas { position: absolute; inset: 0; }
      .pre { position: absolute; left: -999px; font-size: 10px; }
    </style>
  </head>
  <body>
    <div class="pre" style="font-family: Lilita">a</div><div class="pre" style="font-family: Rye">a</div><div class="pre" style="font-family: Bagel">a</div>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURA__" data-width="1080" data-height="1920">
      <canvas id="lienzo" class="clip" width="1080" height="1920" data-start="0" data-duration="__DURA__" data-track-index="1"></canvas>
      <audio id="mezcla" src="mezcla.wav" data-start="0" data-duration="__DURA__" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      const T = __TIEMPOS__;
      const SUBS = true;
      // ================= utilidades =================
      const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
      const prog = (t, a, b) => cl((t - a) / (b - a));
      const eOut = (x) => 1 - Math.pow(1 - x, 3);
      const eIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const eBack = (x) => { const c = 1.9; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const lerp = (a, b, k) => a + (b - a) * k;
      const INK = "#2b1e2e", PAPEL = "#fff8ea", AMA = "#ffd23f";
      function rnd(s) { s = Math.sin(s * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
      const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
      const PAL = T.lineas.flatMap((l) => l.palabras.map((w) => ({ ...w, n: norm(w.p) })));
      function W(p, k = 1) { const n = norm(p); let c = 0; for (const w of PAL) if (w.n === n && ++c === k) return w.a; throw new Error("falta la palabra " + p + " #" + k); }

      const capas = {};
      function recorte(ctx, id, w, h, ox, oy, dibujar, x, y, rot = 0, esc = 1, fx = 1) {
        let c = capas[id];
        if (!c) { c = capas[id] = { a: document.createElement("canvas"), b: document.createElement("canvas") }; c.a.width = c.b.width = w; c.a.height = c.b.height = h; }
        const a = c.a.getContext("2d"), b = c.b.getContext("2d");
        a.clearRect(0, 0, w, h); a.save(); a.translate(ox, oy); a.lineJoin = a.lineCap = "round"; dibujar(a); a.restore();
        b.globalCompositeOperation = "source-over"; b.clearRect(0, 0, w, h); b.drawImage(c.a, 0, 0);
        b.globalCompositeOperation = "source-in"; b.fillStyle = PAPEL; b.fillRect(0, 0, w, h);
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(esc * fx, esc); ctx.translate(-ox, -oy);
        ctx.shadowColor = "rgba(40,20,10,.35)"; ctx.shadowBlur = 20; ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 14;
        ctx.drawImage(c.b, 0, 0); ctx.shadowColor = "transparent";
        for (let k = 0; k < 12; k++) { const an = (k / 12) * Math.PI * 2; ctx.drawImage(c.b, Math.cos(an) * 8, Math.sin(an) * 8); }
        ctx.drawImage(c.a, 0, 0); ctx.restore();
      }
      function forma(g, fill, path, lw = 5) { g.beginPath(); path(g); g.fillStyle = fill; g.fill(); g.lineWidth = lw; g.strokeStyle = INK; g.stroke(); }
      function palito(g, x, y, rot = 0, largo = 520) { g.save(); g.translate(x, y); g.rotate(rot); forma(g, "#8a5a32", (p) => p.roundRect(-10, 0, 20, largo, 8), 4); g.restore(); }

      // ================= el mundo: la granja de los Olsen en Fruita (Colorado) y la feria =================
      const GY = 1250;
      const COOP = 600, CASA = 1700, CAJA = 2650, CARPA = 3750, HOY = 5000;
      const IMG = (s) => { const im = new Image(); im.src = s; return im; };
      const F_OLSEN = IMG("fotos/olsen.jpg"), F_POSTAL = IMG("fotos/postal.jpg"), F_LIFE = IMG("fotos/mike_life.jpg");
      const CLIP = []; for (let i = 1; i <= 84; i++) CLIP.push(IMG(`clips/fiesta/${String(i).padStart(3, "0")}.jpg`));

      const M = {};
      function momentos() {
        M.medio = W("medio"); M.animal = W("animal"); M.perder = W("perder");
        M.colorado = W("colorado"); M.granjero = W("granjero"); M.eligio = W("eligio"); M.cena = W("cena");
        M.manana = W("manana"); M.siguiente = W("siguiente"); M.gallo2 = W("gallo", 2); M.vivo = W("vivo"); M.caminando = W("caminando"); M.patio = W("patio");
        M.alimentaron = W("alimentaron"); M.gotero = W("gotero"); M.feria1 = W("feria", 1); M.feria2 = W("feria", 2);
        M.ganar = W("ganar"); M.cuatro = W("cuatro"); M.mes = W("mes");
        M.llamaba = W("llamaba"); M.mike = W("mike"); M.hizo = W("hizo"); M.sin2 = W("sin", 2); M.cabeza = W("cabeza");
        M.hoy = M.cabeza + 0.75; M.fin = T.dura;
        M.dentro = M.feria1 + 0.55;   // la cámara ya entró a la carpa
      }

      // ---------- la cámara: [segundo, x, y, zoom] ----------
      function camara(t) {
        const K = [
          [0, COOP - 60, 1000, 1.02],
          [M.medio + 0.2, COOP + 40, 1060, 1.42],
          [M.animal - 0.35, COOP, 1010, 1.12],
          [M.perder + 0.1, COOP + 40, 1060, 1.5],
          [M.colorado + 0.35, CASA - 260, 1000, 1.12],
          [M.granjero + 0.25, CASA - 330, 1010, 1.14],
          [M.cena - 0.15, CASA - 40, 1000, 1.14],
          [M.manana + 0.1, CAJA - 60, 1010, 1.22],
          [M.vivo + 0.1, CAJA - 20, 1030, 1.34],
          [M.patio + 0.1, CAJA + 120, 1010, 1.16],
          [M.alimentaron + 0.1, CAJA + 330, 960, 1.5],
          [M.feria1 + 0.05, CARPA, 960, 0.98],
          [M.dentro + 0.35, CARPA, 990, 1.24],
          [M.ganar - 0.1, CARPA + 60, 990, 1.24],
          [M.llamaba, CARPA - 20, 960, 1.42],
          [M.sin2 - 0.05, CARPA - 10, 920, 1.75],
          [M.cabeza + 0.35, CARPA - 170, 990, 1.26],
          [M.hoy + 0.2, HOY, 960, 1.18],
          [M.fin, HOY, 950, 1.24],
        ];
        let i = 0; while (i < K.length - 1 && t > K[i + 1][0]) i++;
        const a = K[i], b = K[Math.min(i + 1, K.length - 1)];
        const dur = Math.min(1.0, Math.max(0.01, b[0] - a[0]));
        const k = b === a ? 0 : eIO(prog(t, b[0] - dur, b[0]));
        let x = lerp(a[1], b[1], k), y = lerp(a[2], b[2], k), z = Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), k));
        x += Math.sin(t * 0.5) * 6; y += Math.cos(t * 0.4) * 4;
        return { x, y, z };
      }
      // de noche entre «cena» y «mañana»
      const noche = (t) => prog(t, M.cena + 0.15, M.cena + 0.55) * (1 - prog(t, M.manana - 0.1, M.siguiente + 0.1));

      // ---------- el fondo: cielo y las mesetas rojas de Colorado ----------
      function cielo(g, t, cam) {
        const gr = g.createLinearGradient(0, 0, 0, 1920); gr.addColorStop(0, "#7fbbe3"); gr.addColorStop(0.55, "#cfe6ee"); gr.addColorStop(1, "#f6e2ab");
        g.fillStyle = gr; g.fillRect(0, 0, 1080, 1920);
        g.save(); g.translate(-cam.x * 0.06, 0);
        const sube = prog(t, M.manana - 0.1, M.siguiente + 0.3), baja = prog(t, M.cena, M.cena + 0.4);
        const solY = 330 + baja * (1 - sube) * 900;
        recorte(g, "sol", 240, 240, 120, 120, (c) => forma(c, "#ffcf4a", (p) => p.arc(0, 0, 80, 0, 7)), 860 + CAJA * 0.06 * sube, solY);
        for (const [x, y, s] of [[200, 420, 1], [1100, 260, 0.8], [1700, 380, 1.1], [2500, 300, 0.9], [3300, 400, 1], [4100, 280, 0.85]])
          recorte(g, "nube" + x, 420, 200, 210, 100, (c) => forma(c, "#fffdf6", (p) => { p.ellipse(-70, 10, 90, 50, 0, 0, 7); p.ellipse(30, -10, 110, 62, 0, 0, 7); p.ellipse(120, 18, 70, 42, 0, 0, 7); }, 3), x, y, 0, s);
        g.restore();
      }
      function mesetas(g, t, cam) {
        g.save(); g.setTransform(cam.z, 0, 0, cam.z, 540 - cam.x * 0.55 * cam.z, 960 - cam.y * cam.z);
        g.fillStyle = "#c8693f"; g.strokeStyle = INK; g.lineWidth = 4;
        g.beginPath(); g.moveTo(-1500, GY - 60);
        // mesetas de cima plana (Colorado National Monument)
        const P = [[-1500, -90], [-1100, -90], [-1020, -330], [-600, -330], [-520, -120], [-200, -110], [-120, -390], [420, -390], [520, -140], [900, -130], [980, -300], [1500, -300], [1580, -100], [2000, -100], [2060, -360], [2600, -360], [2700, -110], [3200, -110], [3260, -280], [3800, -280], [3880, -90], [4500, -90]];
        for (const [x, y] of P) g.lineTo(x, GY + y);
        g.lineTo(4500, GY + 2000); g.lineTo(-1500, GY + 2000); g.closePath(); g.fill(); g.stroke();
        g.strokeStyle = "#a44f2c"; g.lineWidth = 4;
        for (let i = 0; i < 40; i++) { const x = -1400 + i * 150; g.beginPath(); g.moveTo(x, GY - 250 + rnd(i) * 120); g.lineTo(x + 60, GY - 250 + rnd(i) * 120); g.stroke(); }
        g.restore();
      }
      function suelo(g) {
        g.fillStyle = "#b9c96a"; g.fillRect(-1500, GY - 40, 8000, 4000);
        g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(-1500, GY - 40); for (let x = -1500; x <= 6500; x += 80) g.lineTo(x, GY - 40 + Math.sin(x * 0.01) * 8); g.stroke();
        g.strokeStyle = "#8fa04a"; g.lineWidth = 4;
        for (let i = 0; i < 180; i++) { const x = -1400 + i * 42 + rnd(i) * 20, y = GY + rnd(i + 7) * 90; g.beginPath(); g.moveTo(x, y + 30); g.lineTo(x + 6, y); g.stroke(); }
      }
      function sueloDelante(g) {
        g.fillStyle = "#a3b457"; g.fillRect(-1500, GY + 170, 8000, 4000);
        g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(-1500, GY + 170); g.lineTo(6500, GY + 170); g.stroke();
      }

      // ---------- Mike: un gallo blanco (wyandotte); donde va la cabeza, la calcomanía «¿?» ----------
      function gallo(c, o = {}) {
        const paso = o.paso || 0;
        // patas
        c.lineWidth = 12; c.strokeStyle = "#e0a52a";
        for (const s of [-1, 1]) { const d = Math.sin(paso + (s > 0 ? Math.PI : 0)) * 16; c.beginPath(); c.moveTo(s * 26, -120); c.lineTo(s * 30 + d, -6); c.lineTo(s * 30 + d + 30, 0); c.moveTo(s * 30 + d, -6); c.lineTo(s * 30 + d - 22, 0); c.stroke(); }
        c.lineWidth = 4; c.strokeStyle = INK;
        // cola
        for (const [a, l] of [[-2.5, 150], [-2.2, 170], [-1.9, 150]]) forma(c, "#3a3a44", (p) => { p.moveTo(-90, -230); p.quadraticCurveTo(-90 + Math.cos(a) * l * 0.6, -230 + Math.sin(a) * l * 0.9, -90 + Math.cos(a) * l, -230 + Math.sin(a) * l * 0.55); p.quadraticCurveTo(-60 + Math.cos(a) * l * 0.4, -230 + Math.sin(a) * l * 0.3, -60, -210); p.closePath(); }, 4);
        // cuerpo
        forma(c, "#fbf6ea", (p) => p.ellipse(0, -205, 145, 105, 0, 0, 7));
        // plumas con borde (wyandotte plateado)
        c.strokeStyle = "#b9b3a6"; c.lineWidth = 4;
        for (let i = 0; i < 10; i++) { const x = -90 + (i % 5) * 42, y = -230 + Math.floor(i / 5) * 45; c.beginPath(); c.arc(x, y, 18, 0.2, Math.PI - 0.2); c.stroke(); }
        // ala
        forma(c, "#efe7d6", (p) => p.ellipse(-10, -200, 80, 50, -0.15 + (o.aleteo || 0) * Math.sin(paso * 3) * 0.2, 0, 7), 4);
        // cuello sin cabeza: una columna que termina redonda (sin sangre)
        forma(c, "#fbf6ea", (p) => { p.moveTo(70, -270); p.quadraticCurveTo(92, -330, 98, -372); p.quadraticCurveTo(122, -392, 146, -372); p.quadraticCurveTo(150, -320, 140, -250); p.closePath(); });
        forma(c, "#e9c3b4", (p) => p.ellipse(122, -376, 22, 9, -0.1, 0, 7), 3);
      }
      // la calcomanía amarilla «¿?» que tapa el cuello (se despega con «cabeza»)
      function calco(g, id, x, y, s, t) {
        const sale = prog(t, M.cabeza - 0.12, M.cabeza + 0.6);
        if (sale >= 1) return;
        const tiembla = t > M.sin2 - 0.4 ? Math.sin(t * 60) * 0.06 * (1 - sale) : Math.sin(t * 3) * 0.04;
        const dx = sale * 520, dy = -sale * 700 + sale * sale * 300;
        recorte(g, id, 220, 220, 110, 110, (c) => {
          forma(c, AMA, (p) => p.arc(0, 0, 80, 0, 7), 6);
          c.font = "92px Bagel"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = INK; c.fillText("¿?", 0, 8);
        }, x + dx * s, y + dy * s, tiembla + sale * 3.5, s);
      }
      function dibujaMike(g, id, x, y, s, t, o = {}) {
        palito(g, x - 10 * s, y - 40, 0, 600);
        recorte(g, id, 520, 560, 220, 520, (c) => gallo(c, o), x, y, o.rot || 0, s, o.fx || 1);
        const fx = o.fx || 1;
        calco(g, id + "c", x + 122 * s * fx, y - 380 * s, s * 0.95, t);
      }

      // ---------- Lloyd Olsen (overol, sombrero claro, cara delgada; parecido a su foto) ----------
      function lloyd(c, o = {}) {
        const cara = "#efc39c";
        // camisa oscura y overol de mezclilla
        forma(c, "#3f4652", (p) => { p.moveTo(-112, 0); p.lineTo(-96, -265); p.quadraticCurveTo(0, -298, 96, -265); p.lineTo(112, 0); p.closePath(); });
        forma(c, "#4f6e9c", (p) => { p.moveTo(-100, 0); p.lineTo(-74, -205); p.lineTo(74, -205); p.lineTo(100, 0); p.closePath(); });
        forma(c, "#4f6e9c", (p) => p.rect(-58, -250, 116, 60), 4);
        c.lineWidth = 14; c.strokeStyle = "#4f6e9c"; for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 50, -246); c.lineTo(s * 74, -288); c.stroke(); }
        c.lineWidth = 4; c.strokeStyle = INK; for (const s of [-1, 1]) { forma(c, "#d9c26a", (p) => p.arc(s * 48, -240, 8, 0, 7), 3); }
        forma(c, "#3f5d88", (p) => p.rect(-30, -232, 60, 36), 3);
        // brazo (hacha, gotero o nada)
        if (o.brazo) o.brazo(c);
        // cabeza delgada
        forma(c, cara, (p) => p.ellipse(0, -400, 104, 128, 0, 0, 7));
        for (const s of [-1, 1]) forma(c, cara, (p) => p.ellipse(s * 104, -398, 18, 28, 0, 0, 7), 4);
        const sor = o.sorpresa || 0;
        for (const s of [-1, 1]) { forma(c, "#fff", (p) => p.ellipse(s * 40, -414, 22 + sor * 8, 24 + sor * 12, 0, 0, 7), 4); c.fillStyle = INK; c.beginPath(); c.arc(s * 40 + (o.mira || 0) * 7, -412, 10 - sor * 2, 0, 7); c.fill(); }
        c.lineWidth = 8; for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 66, -456 - sor * 16); c.lineTo(s * 18, -450 - sor * 18); c.stroke(); }
        forma(c, "#df9a74", (p) => p.ellipse(0, -362, 22, 30, 0, 0, 7));
        const ab = 6 + sor * 34 + (o.sonrisa ? 0 : 0);
        if (o.sonrisa) { c.lineWidth = 7; c.beginPath(); c.arc(0, -330, 36, 0.3, Math.PI - 0.3); c.stroke(); }
        else forma(c, "#5a1a22", (p) => p.ellipse(0, -312 + ab * 0.2, 30, ab * 0.5, 0, 0, 7));
        // sombrero de vaquero claro
        forma(c, "#d8c7a0", (p) => p.ellipse(0, -500, 170, 32, 0, 0, 7));
        forma(c, "#d8c7a0", (p) => { p.moveTo(-90, -500); p.quadraticCurveTo(-96, -600, -40, -610); p.quadraticCurveTo(0, -585, 40, -610); p.quadraticCurveTo(96, -600, 90, -500); p.closePath(); });
        forma(c, "#6b4a2b", (p) => p.rect(-92, -528, 184, 20), 3);
      }
      const brazoHacha = (alza) => (c) => { c.save(); c.translate(90, -250); c.rotate(-0.3 - alza * 2.2); forma(c, "#3f4652", (p) => p.roundRect(-18, 0, 36, 150, 14)); forma(c, "#efc39c", (p) => p.arc(0, 160, 24, 0, 7)); forma(c, "#8a5a32", (p) => p.rect(-8, 120, 16, 170), 4); forma(c, "#9aa3a8", (p) => { p.moveTo(8, 250); p.lineTo(70, 236); p.quadraticCurveTo(84, 268, 70, 300); p.lineTo(8, 290); p.closePath(); }); c.restore(); };
      const brazoGotero = (k) => (c) => { c.save(); c.translate(-90, -250); c.rotate(0.9 + Math.sin(k * 6) * 0.05); forma(c, "#3f4652", (p) => p.roundRect(-18, 0, 36, 170, 14)); forma(c, "#efc39c", (p) => p.arc(0, 180, 24, 0, 7)); forma(c, "#cfe8f2", (p) => p.roundRect(-9, 196, 18, 70, 6), 4); forma(c, "#c9573f", (p) => p.ellipse(0, 192, 16, 22, 0, 0, 7), 4); c.restore(); };

      function persona(c, o) {
        forma(c, o.ropa, (p) => { p.moveTo(-110, 0); p.lineTo(-92, -262); p.quadraticCurveTo(0, -296, 92, -262); p.lineTo(110, 0); p.closePath(); });
        forma(c, o.cara, (p) => p.ellipse(0, -395, 110, 122, 0, 0, 7));
        if (o.pelo) forma(c, o.pelo, (p) => { p.ellipse(0, -470, 112, 56, 0, Math.PI, 0); p.closePath(); });
        if (o.gorra) { forma(c, o.gorra, (p) => { p.ellipse(0, -470, 112, 60, 0, Math.PI, 0); p.closePath(); }); forma(c, o.gorra, (p) => p.ellipse(70, -470, 80, 16, 0, 0, 7)); }
        const sor = o.sorpresa || 0;
        for (const s of [-1, 1]) { forma(c, "#fff", (p) => p.ellipse(s * 42, -410, 24 + sor * 9, 26 + sor * 12, 0, 0, 7), 4); c.fillStyle = INK; c.beginPath(); c.arc(s * 42 + (o.mira || 0) * 8, -408, 11 - sor * 2, 0, 7); c.fill(); }
        forma(c, "#df9a74", (p) => p.ellipse(0, -358, 26, 24, 0, 0, 7));
        forma(c, "#5a1a22", (p) => p.ellipse(0, -300, 28, 8 + sor * 22, 0, 0, 7));
        if (o.manos) for (const s of [-1, 1]) forma(c, o.cara, (p) => p.arc(s * 120, -330 - sor * 20, 26, 0, 7));
      }

      // ---------- foto o clip que se levanta del suelo (sobre una estaca) ----------
      function fotoLevanta(g, t, id, img, ta, tb, x, y, W0, fuente, rot = 0, extra) {
        const k = eBack(prog(t, ta, ta + 0.45)), b = eOut(prog(t, tb, tb + 0.4));
        if (k <= 0 || b >= 1) return;
        const H0 = Math.round(W0 * (img.height || 3) / (img.width || 4));
        const sy = Math.max(0.02, k * (1 - b));
        g.save(); g.translate(x, y); g.scale(1, sy);
        recorte(g, id, W0 + 120, H0 + 420, (W0 + 120) / 2, H0 + 330, (c) => {
          forma(c, "#8a5a32", (p) => p.rect(-14, -40, 28, 300));
          c.save(); c.translate(0, -40); c.rotate(rot);
          forma(c, "#f6efe0", (p) => p.rect(-W0 / 2 - 22, -H0 - 96, W0 + 44, H0 + 96 + 10), 3);
          if (img.complete && img.naturalWidth) c.drawImage(img, -W0 / 2, -H0 - 74, W0, H0);
          c.lineWidth = 3; c.strokeStyle = INK; c.strokeRect(-W0 / 2, -H0 - 74, W0, H0);
          if (extra) extra(c, W0, H0);
          c.font = "28px Lilita"; c.textAlign = "center"; c.fillStyle = "#6b5a52"; c.fillText(fuente, 0, -28);
          c.fillStyle = "rgba(240,226,180,.9)"; for (const s of [-1, 1]) { c.save(); c.translate(s * (W0 / 2 - 24), -H0 - 92); c.rotate(s * 0.5); c.fillRect(-56, -16, 112, 32); c.restore(); }
          c.restore();
        }, 0, 0, 0, 1, 1);
        g.restore();
      }

      // ---------- el gallinero ----------
      function gallinero(g, t) {
        recorte(g, "coop", 560, 520, 280, 480, (c) => {

      // ---------- subtítulos: tres palabras, la que suena en amarillo ----------
      const GRUPOS = [];
      for (const l of T.lineas) { const ws = l.palabras; for (let i = 0; i < ws.length; i += 3) { const gr = ws.slice(i, i + 3); GRUPOS.push({ ws: gr, a: Math.max(0, gr[0].a), b: i + 3 < ws.length ? ws[i + 3].a : l.fin + 0.2 }); } }
      function subs(g, t) {
        if (!SUBS) return;

        g.restore();

      // ================= pintar un fotograma =================

        const cam = camara(t);

        carpaFrente(g, t);

        // la noche: todo se oscurece y sale la luna
