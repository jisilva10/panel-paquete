      // ---------- foto real que se levanta del suelo en su estaca ----------

      // ---------- abajo: Armstrong en la sala ----------

      function tarantula(c, t) {

      // ---------- el final: el camarógrafo y la piedra mojada ----------

            forma(c, "#33302e", (p) => p.roundRect(-110, -470, 230, 150, 14));

      // ---------- clips reales dentro del mundo: el pozo (por la boca de la cueva) y la llegada (por el visor) ----------
      function clip(g, t, frames, a, b, fuente) {
        const entra = eOut(prog(t, a, a + 0.45)), sale = eOut(prog(t, b, b + 0.4));
        if (entra <= 0 || sale >= 1) return;
        const im = frames[Math.min(frames.length - 1, Math.max(0, Math.floor((t - a) * 30)))];
        g.save();
        g.beginPath(); g.arc(540, 900, 30 + entra * 1150, 0, 7); g.clip();
        g.globalAlpha = 1 - sale;
        const s = 1 + 0.4 * sale;
        g.translate(540, 820); g.scale(s, s);
        g.fillStyle = "#1c1410"; g.fillRect(-900, -1400, 1800, 2800);
        const w = 960, h = 720;
        g.save(); g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 36); g.clip();
        if (im && im.complete && im.width) g.drawImage(im, -w / 2, -h / 2, w, h);

        g.restore();

        texto(g, fuente, 0, h / 2 + 48, "28px Lilita", "rgba(255,248,234,.75)");
        g.restore();
      }

      // ---------- subtítulos: tres palabras, la que suena en amarillo ----------
      const GRUPOS = [];
      for (const l of T.lineas) { const ws = l.palabras; for (let i = 0; i < ws.length; i += 3) { const gr = ws.slice(i, i + 3); GRUPOS.push({ ws: gr, a: Math.max(0, gr[0].a), b: i + 3 < ws.length ? ws[i + 3].a : l.fin + 0.2 }); } }
      function subs(g, t) {
        if (SIN_SUBS) return;
        const gr = GRUPOS.find((x) => t >= x.a && t < x.b); if (!gr) return;
        g.save();
        g.font = "84px Lilita"; g.textBaseline = "middle"; g.textAlign = "left"; g.lineJoin = "round";
        const txt = gr.ws.map((w) => w.p.replace(/\.\.\.|…|:|\*/g, "").replace(/[,.]$/, ""));
        const an = txt.map((s) => g.measureText(s + " ").width); const total = an.reduce((a, b) => a + b, 0);
        const fit = Math.min(1, 940 / total); let x = 540 - total / 2; const y = 1580;
        const pop = eBack(prog(t, gr.a, gr.a + 0.16));
        g.translate(540, y); g.scale(fit * (0.86 + 0.14 * pop), fit * (0.86 + 0.14 * pop)); g.translate(-540, -y);
        gr.ws.forEach((w, i) => { if (t >= w.a - 0.03) { const on = t >= w.a && t < w.f + 0.06; g.lineWidth = 16; g.strokeStyle = INK; g.strokeText(txt[i], x, y); g.fillStyle = on ? AMARILLO : PAPEL; g.fillText(txt[i], x, y); } x += an[i]; });
        g.restore();
      }

      // ================= pintar un fotograma =================
      function pintar(t) {
        const g = document.getElementById("lienzo").getContext("2d");
        g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 1080, 1920);

        lomas(g, t, cam);
        g.setTransform(cam.z, 0, 0, cam.z, 540 - cam.x * cam.z, 960 - cam.y * cam.z);

        tierra(g, t);
        arriba(g, t); campamento(g, t); abajo(g, t); final(g, t);
        delante(g);
        // de noche, la selva también se oscurece

        g.setTransform(1, 0, 0, 1, 0, 0);
        if (n > 0) { g.fillStyle = `rgba(16,20,52,${0.45 * n})`; g.fillRect(0, 0, 1080, 1920); }
        clip(g, t, CLIP_POZO, M.pozoIn, M.pozoOut, "Video: Tree Films · Bill Forsyth (Cueva de los Tayos, 1976)");
        clip(g, t, CLIP_LLEGA, M.llegaIn, M.llegaOut, "Video: Tree Films · Bill Forsyth (Quito, 1976)");
        const v = g.createRadialGradient(540, 900, 520, 540, 960, 1250); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(60,30,10,.28)"); g.fillStyle = v; g.fillRect(0, 0, 1080, 1920);
        subs(g, t);
      }

      // ================= reloj de Hyperframes =================
      // Pinta SIEMPRE, aunque falte cargar una foto o un clip (si no, quedan cuadros celestes vacíos).
      momentos();
      window.__timelines = window.__timelines || {};
